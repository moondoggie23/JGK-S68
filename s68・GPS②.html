<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>GPS TAG 追跡画面 ②</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one iPhone XR screen (414x896pt). Light field-device look: flat white panels with square-ish corners,
   teal for "me", orange for the tag. Deliberately unlike the earlier dark glass / red crosshair version. */
:root{
  color-scheme: light;
  --page:#1d2226;
  --panel:#ffffff; --panel2:#f3f5f6; --line:#d9dee2;
  --ink:#16202a; --dim:#5e6b77; --faint:#98a3ad;
  --me:#00a296; --me-soft:rgba(0,162,150,.16);
  --tag:#e5231b; --tag-soft:rgba(229,35,27,.16);
  --ok:#2e9e4f; --north:#e0261b;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--jp);margin:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
@media (min-width:480px){
  body{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .device{flex:none;width:414px;height:896px;border-radius:44px;transform-origin:center;box-shadow:0 0 0 10px #0d1013,0 0 0 11px #3a4148,0 30px 80px rgba(0,0,0,.5)}
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* fake status bar: computer only */
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 32px;font:600 15px -apple-system,"SF Pro Text",sans-serif;z-index:6;color:#fff}
.sb .icons{display:flex;gap:6px;align-items:center}
.sb svg{display:block;fill:#fff}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:12}

/* ===== top: two tiles side by side + bearing strip ===== */
.top{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--ink);color:#fff;
  box-shadow:0 6px 18px rgba(20,32,42,.12);padding:44px 12px 0}
.appbar{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.appbar .ttl{font-weight:700;font-size:15px;letter-spacing:.04em}
.appbar .logo{display:block;width:30px;height:30px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.25)}
.appbar .logo svg{display:block;border-radius:7px}
.appbar .mode{margin-left:auto;font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--ink);background:#fff;padding:3px 7px;border-radius:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel2);border-radius:6px;padding:9px 10px 10px;border-top:3px solid;min-width:0}
.tile.me{border-color:var(--me)}
.tile.tag{border-color:var(--tag)}
.tile .k{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em}
.tile .k svg{flex:none}
.tile .v{font-size:17px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .c{font:500 10.5px/1.5 var(--mono);color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 4px 11px}
.strip .lbl{font-size:11px;color:var(--dim);font-weight:700}
.strip .big{font:600 22px var(--mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.strip .big small{font-size:12px;color:var(--dim);margin-left:3px}
.meter{position:relative;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--me) 0 6px,transparent 6px 9px);width:0}
.strip .dir{font-size:12px;color:var(--dim);text-align:right;white-space:nowrap}
.strip .dir b{color:var(--ink);font-size:14px}

/* compass dial */
/* right-side stack over the map: compass, menu, locate */
.fabs{position:absolute;right:12px;bottom:110px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:12px}
#compass{width:62px;height:62px;filter:drop-shadow(0 2px 5px rgba(20,32,42,.25))}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 8px rgba(20,32,42,.28);transition:background .2s,transform .1s}
.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.fab svg{display:block}
#b-locate.on{background:var(--me)}
#b-locate.on path,#b-locate.on circle{stroke:#fff}
#b-locate.on .dot{fill:#fff}

#b-refresh.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* loading overlay shown while refreshing (poor signal: takes REFRESH_MS) */
.loading{position:absolute;left:0;right:0;z-index:9;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.loading.show{opacity:1}
.loading .box{background:rgba(22,32,42,.88);color:#fff;border-radius:14px;padding:18px 22px 16px;display:grid;justify-items:center;gap:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);min-width:150px}
.loading .ring{width:40px;height:40px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .8s linear infinite}
.loading .msg{font-size:13px;font-weight:700;letter-spacing:.02em}
.toast{position:absolute;left:50%;z-index:9;transform:translate(-50%,-6px);opacity:0;transition:opacity .25s,transform .25s;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px;white-space:nowrap;
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:#4cd577}
.toast b{font-weight:700}
.toast.fail i{background:#ff5a4f}
.toast span{font:500 12px var(--mono);color:#9aa6b1}
.fabs.left{right:auto;left:12px}
/* map picker shown before the screen starts */
#picker{position:absolute;inset:0;z-index:30;background:var(--ink);display:grid;place-items:center;padding:24px;color:#fff}
#picker[hidden]{display:none!important}
.pk{display:grid;justify-items:center;gap:12px;text-align:center;max-width:300px}
.pk b{font-size:18px}
.pk p{margin:0;font-size:13px;line-height:1.6;color:#b7c1ca}
.pkbtn{margin-top:6px;background:var(--me);color:#fff;font-weight:700;font-size:15px;padding:12px 26px;border-radius:10px;cursor:pointer}
.pkbtn:focus-within,.pkbtn:hover{filter:brightness(1.08)}
.pknote{color:#ffb4ae!important}
.mlist li.tap{cursor:pointer}
/* menu sheet */
#menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(13,18,24,.42);opacity:0;pointer-events:none;transition:opacity .25s}
#menu.open{opacity:1;pointer-events:auto}
.msheet{background:#fff;border-radius:16px 16px 0 0;padding:10px 0 calc(30px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .25s}
#menu.open .msheet{transform:none}
.mhead{display:flex;align-items:center;padding:6px 18px 10px}
.mhead b{font-size:17px}
.mclose{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center;cursor:pointer}
.mdev{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:12px;border-radius:8px;background:var(--panel2)}
.mdev .ic{width:36px;height:36px;border-radius:8px;background:var(--tag);display:grid;place-items:center}
.mdev .n{font:600 15px var(--mono)}
.mdev .s{font-size:12px;color:#d98a00;font-weight:700}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);font-size:15px;font-weight:500}
.mlist li svg{flex:none}
.mlist li .chev{margin-left:auto;color:var(--faint)}
#compass svg{width:100%;height:100%;display:block}

/* ===== bottom: device status bar ===== */
#ui{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:#fff;
  padding:12px 16px calc(26px + env(safe-area-inset-bottom,0px))}
#ui-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dev{width:40px;height:40px;border-radius:8px;background:var(--tag);display:grid;place-items:center}
.dname{font:600 15px var(--mono);letter-spacing:.06em}
.dsub{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#ffc46b}
.dsub i{width:8px;height:8px;border-radius:50%;background:#ffa31a;animation:bl 2.4s steps(1,end) infinite}
/* irregular flicker to suggest an unstable connection */
@keyframes bl{0%{opacity:1}18%{opacity:.2}24%{opacity:1}55%{opacity:.2}60%{opacity:1}64%{opacity:.2}70%{opacity:1}}
.facts{display:flex;gap:14px;text-align:right}
.facts div{display:grid;gap:1px}
.facts span{font-size:10px;color:#9aa6b1;letter-spacing:.06em}
.facts b{font:600 13px var(--mono);font-variant-numeric:tabular-nums}

/* hidden control panel: long-press the map */
#ctrl{margin-top:12px;border-top:1px solid #33404b;padding-top:12px}
#ctrl-btns{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.cbtn{background:#2b3640;border:0;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
#cbtn-play{background:var(--me);width:48px;height:48px}
.cbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.clabel{color:#9aa6b1;font-size:11px;white-space:nowrap;width:28px}
.cval{color:#7ee0d6;font:600 12px var(--mono);min-width:44px;text-align:right}
input[type=range]{flex:1;min-width:0;accent-color:var(--me)}
.hint{font-size:10.5px;color:#6f7d89;text-align:center;margin-top:6px}
/* name switch in the control panel */
.seg{flex:1;display:flex;gap:6px}
.seg button{flex:1;height:30px;border:0;border-radius:6px;background:#2b3640;color:#9aa6b1;font:700 12px var(--jp);cursor:pointer}
.seg button.on{background:var(--me);color:#fff}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.jpname{font-family:var(--jp)!important;letter-spacing:.08em}

@media (max-width:479px){
  .sb,.homebar{display:none}
  .top{padding-top:max(8px,env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.dsub i{animation:none}}
</style>

</head>
<body>
<div class="device" id="wrap">
  <canvas id="cv"></canvas>

  <div class="sb">
    <span id="clock">14:52</span>
    <span class="icons" aria-hidden="true">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill-opacity=".3"/><rect x="10" y="3" width="3" height="9" rx="1" fill-opacity=".3"/><rect x="15" y="0" width="3" height="12" rx="1" fill-opacity=".3"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="top" id="top">
    <div class="appbar">
      <span class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 60 60">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd0bf"/><stop offset="1" stop-color="#00877c"/></linearGradient></defs>
          <rect width="60" height="60" rx="14" fill="url(#lg)"/>
          <circle cx="30" cy="27" r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <path d="M30 12c-7.2 0-13 5.6-13 12.6C17 34 30 47 30 47s13-13 13-22.4C43 17.6 37.2 12 30 12z" fill="#fff"/>
          <circle cx="30" cy="25" r="6.2" fill="#e5231b"/>
          <circle cx="30" cy="25" r="2.4" fill="#fff"/>
        </svg>
      </span>
      <span class="ttl">見守りタグを探す</span>
      <span class="mode">TRACKING</span>
    </div>
  </div>

  <div class="fabs" id="fabs">
  <div id="compass" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="#fff" stroke="#d9dee2" stroke-width="2"/>
      <g id="dial"></g>
      <g id="needle">
        <polygon points="60,14 51,60 69,60" fill="#e0261b"/>
        <polygon points="60,106 51,60 69,60" fill="#16202a"/>
        <text x="60" y="11" font-size="15" font-weight="800" font-family="-apple-system,sans-serif" text-anchor="middle" fill="#e0261b" id="ntext">N</text>
      </g>
      <circle cx="60" cy="60" r="6" fill="#fff" stroke="#16202a" stroke-width="2"/>
    </svg>
  </div>
  <button class="fab" id="b-locate" type="button" aria-label="現在地を表示" aria-pressed="false">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00a296" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5"/><circle class="dot" cx="12" cy="12" r="2.6" fill="#00a296" stroke="none"/></svg>
  </button>
  <button class="fab" id="b-menu" type="button" aria-label="メニュー">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  </div>

  <div id="picker">
    <div class="pk">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00a296" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      <b>地図画像を読み込む</b>
      <p>撮影で使う地図の画像ファイルを選んでください。元の画質のまま表示します。</p>
      <label class="pkbtn" for="mapfile">画像を選択</label>
      <input type="file" id="mapfile" accept="image/*" hidden>
      <p class="pknote" id="pkerr" hidden></p>
    </div>
  </div>
  <div class="loading" id="loading" aria-hidden="true"><div class="box"><div class="ring"></div><div class="msg">位置情報を取得中…</div></div></div>
  <div class="toast" id="toast" role="status"><i></i><b id="toast-msg">最新の位置情報を取得しました</b></div>

  <div class="fabs left" id="fabsL">
  <button class="fab" id="b-refresh" type="button" aria-label="最新の情報を取得">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.1"/><path d="M20 4v7h-7"/></svg>
  </button>
  </div>

  <div id="menu" aria-hidden="true">
    <div class="msheet" role="dialog" aria-label="メニュー">
      <div class="mhead"><b>メニュー</b>
        <button class="mclose" id="m-close" type="button" aria-label="閉じる"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
      <div class="mdev">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff"/><circle cx="12" cy="12" r="3.5" fill="#e5231b"/></svg></div>
        <div><div class="n" id="m-name">TAG-01</div><div class="s">接続不安定</div></div>
      </div>
      <ul class="mlist">
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>移動履歴<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2.5" fill="#16202a"/></svg>エリア通知の設定<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>通知<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/></svg>登録端末の管理<span class="chev">›</span></li>
        <li class="tap" id="m-map" role="button" tabindex="0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>地図画像を変更<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>アプリについて<span class="chev">›</span></li>
      </ul>
    </div>
  </div>

  <div id="ui">
    <div id="ui-main">
      <div class="dev"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#fff"/><circle cx="12" cy="12" r="3.5" fill="#e5231b"/></svg></div>
      <div class="dname" id="ui-name">TAG-01</div>
      <div class="dsub"><i></i><span>接続不安定</span></div>
    </div>
    <div id="ctrl" hidden>
      <div id="ctrl-btns">
        <button class="cbtn" id="b-back" type="button" aria-label="10%戻る"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M11 19 2 12l9-7v14zM22 19l-9-7 9-7v14z" fill="#fff"/></svg></button>

function resize(){
  wrap.style.transform='';
  if(innerWidth>=480){const k=Math.min(1,(innerHeight-60)/896,(innerWidth-60)/414);wrap.style.transform=k<1?`scale(${k})`:''}
  vw=wrap.clientWidth;vh=wrap.clientHeight;dpr=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  const topH=$('top').offsetHeight;topH0=topH;uiH0=document.getElementById('ui').offsetHeight;
  // fit vertically: tag stays where it was near the top, start of my route sits just above the bottom bar
  const yTag=topH+70,yMe=vh-uiH0-56,sy=FIT_POS[1];
  S=Math.max(vw/M.imgW,vh/M.imgH,(yMe-yTag)/(sy-M.beaconPos[1]));
  OY=yTag-M.beaconPos[1]*S;
  const xs=TAG_ROUTE.map(p=>p[0]).concat(M.beaconPos[0],ME_POS[0]),cx=(Math.min(...xs)+Math.max(...xs))/2;
  OX=Math.min(0,Math.max(vw-M.imgW*S,vw/2-cx*S));
  $('fabs').style.bottom=$('fabsL').style.bottom=(document.getElementById('ui').offsetHeight+14)+'px';
}
/* camera for the locate button: z = zoom, cam.t = 0 (overview) .. 1 (centered on me) */
const ZOOM=1.9;const cam={t:0,goal:0,fx:0,fy:0,cx:0,cy:0};let topH0=0,uiH0=0;
const camApply=(px,py)=>{const t=cam.t,z=1+(ZOOM-1)*t,cx=cam.cx,cy=cam.cy;
  return[cam.fx+(px-cam.fx)*z+(cx-cam.fx)*t,cam.fy+(py-cam.fy)*z+(cy-cam.fy)*t]};
const sc=(x,y)=>camApply(OX+x*S,OY+y*S);

/* route */
function pointAt(f){const r=M.route,n=r.length;f=Math.max(0,Math.min(1,f))*(n-1);const i=Math.floor(f),t=f-i,a=r[i],b=r[Math.min(i+1,n-1)];
  return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
const tagAt=f=>{const r=TAG_ROUTE,n=r.length;f=Math.max(0,Math.min(1,f))*(n-1);const i=Math.floor(f),t=f-i,a=r[i],b=r[Math.min(i+1,n-1)];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]};
const fmtSp=v=>'x'+(+v<1?(+v).toFixed(2):(+v).toFixed(1));
const routeFrac=()=>(M.preRoute.length-1+progress*(M.trackerRoute.length-1))/(M.route.length-1);

/* geo */
function toMeters(dx,dy){const n=M.northDeg*Math.PI/180;return{north:(dx*Math.sin(n)-dy*Math.cos(n))*M.mpp,east:(dx*Math.cos(n)+dy*Math.sin(n))*M.mpp}}
function toLatLon(x,y){const m=toMeters(x-M.ref.x,y-M.ref.y);return{lat:M.ref.lat+m.north/111320,lon:M.ref.lon+m.east/(111320*Math.cos(M.ref.lat*Math.PI/180))}}
const dms=(v,p,n)=>{const h=v>=0?p:n;let t=Math.round(Math.abs(v)*36000);const d=Math.floor(t/36000);t-=d*36000;const m=Math.floor(t/600),s=(t-m*600)/10;
  return `${h} ${d}°${String(m).padStart(2,'0')}′${s.toFixed(1).padStart(4,'0')}″`};
function nearest(x,y){let b=null,bd=1e9;for(const[n,px,py]of M.places){const d=Math.hypot(px-x,py-y);if(d<bd){bd=d;b=n}}return b}
const DIRS=['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];

/* drawing */
/* trail between two positions along the route (0 = my position, 1 = where the tag started) */
function drawTrail(f0,f1){
  const r=TAG_ROUTE,n=r.length,pt=f=>{f=Math.max(0,Math.min(1,f))*(n-1);const i=Math.floor(f),t=f-i,a=r[i],b=r[Math.min(i+1,n-1)];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]};
  const e0=f0*(n-1),e1=f1*(n-1);
  const path=()=>{ctx.beginPath();ctx.moveTo(...sc(...pt(f0)));for(let i=Math.ceil(e0);i<=Math.floor(e1);i++)ctx.lineTo(...sc(...r[i]));ctx.lineTo(...sc(...pt(f1)))};
  ctx.lineCap='round';ctx.lineJoin='round';
  path();ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.stroke();
  path();ctx.strokeStyle='#e5231b';ctx.lineWidth=5;ctx.stroke();
  path();ctx.setLineDash([2,8]);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
}
function drawLink(me){
  const[a,b]=[sc(...me),sc(...M.beaconPos)];
  ctx.setLineDash([7,6]);ctx.strokeStyle='rgba(229,35,27,.75)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([]);
}
function drawTag(ts,pos){
  const[x,y]=sc(...pos);
  if(tagFlash){const e=(performance.now()-tagFlash)/900;if(e<1){ctx.beginPath();ctx.arc(x,y,12+e*70,0,7);ctx.strokeStyle=`rgba(229,35,27,${1-e})`;ctx.lineWidth=4*(1-e)+1;ctx.stroke()}}
  for(let k=0;k<3;k++){const p=((ts/2200)+k/3)%1;ctx.beginPath();ctx.arc(x,y,10+p*46,0,7);
    ctx.strokeStyle=`rgba(229,35,27,${(1-p)*.7})`;ctx.lineWidth=2;ctx.stroke()}
  ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fillStyle='rgba(229,35,27,.14)';ctx.fill();
  ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fillStyle='#fff';ctx.shadowBlur=6;ctx.shadowColor='rgba(0,0,0,.3)';ctx.fill();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fillStyle='#e5231b';ctx.fill();
  ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.font=/^[\x00-\x7f]*$/.test(TAG_LABEL)?'600 11px "IBM Plex Mono",ui-monospace,monospace':'700 12px "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  const tw=ctx.measureText(TAG_LABEL).width,lx=x+20,ly=y-20;
  ctx.fillStyle='#e5231b';ctx.fillRect(lx,ly-9,tw+12,18);
  ctx.beginPath();ctx.moveTo(lx,ly+9);ctx.lineTo(lx-6,ly+15);ctx.lineTo(lx+6,ly+9);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(TAG_LABEL,lx+6,ly+.5);
}
function drawMe(me,heading,ts){
  const[x,y]=sc(...me);
  // slow breathing halo: 26px at its largest, about 2.6s per cycle
  const k=.5-.5*Math.cos(ts/2600*Math.PI*2);
  ctx.beginPath();ctx.arc(x,y,14+12*k,0,7);ctx.fillStyle=`rgba(0,162,150,${.06+.16*k})`;ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(heading);
  ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(11,12);ctx.lineTo(0,6);ctx.lineTo(-11,12);ctx.closePath();
  ctx.fillStyle='#00a296';ctx.shadowBlur=6;ctx.shadowColor='rgba(0,0,0,.35)';ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();ctx.restore();
}
let heading=0,uiT=0;
function draw(ts){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,vw,vh);
  // I stay put; the tag drives along the lakeside road away from me, then north up the main road
  const me=ME_POS,tf=progress,tag=tagAt(tf);
  cam.fx=OX+me[0]*S;cam.fy=OY+me[1]*S;cam.cx=vw/2;cam.cy=topH0+(vh-topH0-uiH0)/2;
  cam.t+=(cam.goal-cam.t)*.08;if(Math.abs(cam.goal-cam.t)<.001)cam.t=cam.goal;
  if(M.img.complete&&M.img.naturalWidth){ctx.imageSmoothingQuality='high';const[ix,iy]=sc(0,0),zz=1+(ZOOM-1)*cam.t;ctx.drawImage(M.img,ix,iy,M.imgW*S*zz,M.imgH*S*zz)}
  heading=ME_HEADING;

  drawMe(me,heading,ts);drawTag(ts,tag);
  if(ts-uiT>250){uiT=ts;updateInfo(me)}
}
const startD=(()=>{const a=ME_POS,m=toMeters(M.beaconPos[0]-a[0],M.beaconPos[1]-a[1]);return Math.hypot(m.north,m.east)})();
function updateInfo(me){
  const now=new Date();$('clock').textContent=`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const a=toLatLon(...me),b=toLatLon(...M.beaconPos);
  $('me-name').textContent=nearest(...me)+' 付近';
  $('me-co').innerHTML=dms(a.lat,'N','S')+'<br>'+dms(a.lon,'E','W');
  $('tag-name').textContent=M.tagName;
  $('tag-co').innerHTML=dms(b.lat,'N','S')+'<br>'+dms(b.lon,'E','W');
  const m=toMeters(M.beaconPos[0]-me[0],M.beaconPos[1]-me[1]),dd=Math.hypot(m.north,m.east);
  $('dist').innerHTML=dd>=1000?(dd/1000).toFixed(1)+'<small>km</small>':Math.round(dd)+'<small>m</small>';
  $('meter').style.width=Math.max(0,Math.min(100,(1-dd/startD)*100))+'%';
  const br=(Math.atan2(m.east,m.north)*180/Math.PI+360)%360;$('dir').textContent=DIRS[Math.round(br/22.5)%16];
  $('spd').textContent=playing&&progress<1?Math.round(38+Math.sin(now/1300)*6)+' km/h':'0 km/h';
  $('upd').textContent=(Math.floor(now/1000)%4)+'秒前';
}

/* loop */
function loop(ts){
  if(last==null)last=ts;const dt=ts-last;last=ts;
  if(playing&&!seeking&&progress<1){progress=Math.min(1,progress+dt*speed/M.duration);if(progress>=1)setPlaying(false)}
  if(!seeking){$('si').value=Math.round(progress*1000);$('sv').textContent=Math.round(progress*100)+'%'}
  draw(ts);requestAnimationFrame(loop);
}

/* controls */
function setPlaying(v){playing=v;last=null;$('ip').hidden=v;$('ipu').hidden=!v;$('cbtn-play').setAttribute('aria-label',v?'一時停止':'再生')}
function sync(){$('si').value=Math.round(progress*1000);$('sv').textContent=Math.round(progress*100)+'%';$('sp').value=speed;$('spv').textContent=fmtSp(speed);
  $('needle').setAttribute('transform',`rotate(${M.northDeg} 60 60)`);$('ntext').setAttribute('transform',`rotate(${-M.northDeg} 60 7)`)}
$('cbtn-play').onclick=()=>{if(progress>=1)progress=TAG_START;setPlaying(!playing)};
$('b-back').onclick=()=>{progress=Math.max(TAG_START,progress-.1);sync()};
$('b-fwd').onclick=()=>{progress=Math.min(1,progress+.1);sync()};
$('b-reset').onclick=()=>{progress=TAG_START;setPlaying(false);sync()};
const si=$('si');si.oninput=()=>{progress=Math.max(TAG_START,si.value/1000);$('sv').textContent=Math.round(progress*100)+'%'};
si.onpointerdown=()=>seeking=true;addEventListener('pointerup',()=>seeking=false);
{const rf=document.getElementById('rf'),rfv=document.getElementById('rfv');
  rf.value=REFRESH_MS/1000;rfv.textContent=rf.value+'秒';
  rf.oninput=()=>{REFRESH_MS=rf.value*1000;rfv.textContent=rf.value+'秒'}}
/* name switch: map label, bottom bar and menu all follow */
document.querySelectorAll('#nameseg button').forEach(btn=>btn.onclick=()=>{
  TAG_LABEL=btn.dataset.name;const jp=!/^[\x00-\x7f]*$/.test(TAG_LABEL);
  document.querySelectorAll('#nameseg button').forEach(x=>x.classList.toggle('on',x===btn));
  for(const id of['ui-name','m-name']){const e=document.getElementById(id);e.textContent=TAG_LABEL;e.classList.toggle('jpname',jp)}});
$('sp').oninput=e=>{speed=+e.target.value;$('spv').textContent=fmtSp(speed)};
let pt=null;
let refreshing=false,tagFlash=0,toastTimer=null;
$('b-refresh').onclick=()=>{if(refreshing)return;refreshing=true;const b=$('b-refresh');b.classList.add('spin');const ld=document.getElementById('loading');ld.style.top=topH0+'px';ld.style.bottom=(uiH0+(vh-topH0-uiH0)/2)+'px';ld.classList.add('show');
  setTimeout(()=>{b.classList.remove('spin');ld.classList.remove('show');refreshing=false;if(!REFRESH_FAIL)tagFlash=performance.now();
    const n=new Date(),t=$('toast');$('toast-t').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
    t.classList.toggle('fail',REFRESH_FAIL);document.getElementById('toast-msg').textContent=REFRESH_FAIL?'取得に失敗しました':'最新の位置情報を取得しました';
    t.style.top=(topH0+12)+'px';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)},REFRESH_MS)};
$('b-locate').onclick=()=>{cam.goal=cam.goal?0:1;$('b-locate').classList.toggle('on',!!cam.goal);$('b-locate').setAttribute('aria-pressed',cam.goal?'true':'false')};
const menu=$('menu');
$('m-map').onclick=()=>{closeMenu();document.getElementById('mapfile').click()};
$('m-map').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('m-map').click()}};
$('b-menu').onclick=()=>{menu.classList.add('open');menu.setAttribute('aria-hidden','false')};
const closeMenu=()=>{menu.classList.remove('open');menu.setAttribute('aria-hidden','true')};
$('m-close').onclick=closeMenu;menu.addEventListener('click',e=>{if(e.target===menu)closeMenu()});
new ResizeObserver(()=>{uiH0=document.getElementById('ui').offsetHeight;$('fabs').style.bottom=$('fabsL').style.bottom=(document.getElementById('ui').offsetHeight+14)+'px'}).observe(document.getElementById('ui'));
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('#ui,.fabs,#menu,.toast,#picker'))return;pt=setTimeout(()=>{$('ctrl').hidden=!$('ctrl').hidden},600)});
['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev=>wrap.addEventListener(ev,e=>{if(ev!=='pointermove'||Math.abs(e.movementX)+Math.abs(e.movementY)>6)clearTimeout(pt)}));
wrap.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('cbtn-play').click()}});

addEventListener('resize',resize);
(document.fonts?document.fonts.ready:Promise.resolve()).then(resize);
document.getElementById('si').min=Math.round(TAG_START*1000);resize();sync();requestAnimationFrame(loop);
})();
</script>

</body>
